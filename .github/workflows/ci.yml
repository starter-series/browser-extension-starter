name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checks:
    uses: starter-series/.github/.github/workflows/reusable-node-ci.yml@main
    with:
      profile: extension
  ci:
    if: ${{ always() }}
    needs:
    - checks
    runs-on: ubuntu-latest
    steps:
    - uses: starter-series/.github/.github/actions/require-checks@main
      with:
        results: ${{ toJSON(needs) }}
